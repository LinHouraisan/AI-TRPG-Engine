<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52677c"/></marker></defs><text x="35" y="50" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#243B53">AI TRPG：行动、生成与恢复流程</text><text x="35" y="81" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">架构概览；AI 网关为项目已有服务模块，实际调用取决于所选路由。</text><rect x="25" y="102" width="280" height="710" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/><text x="43" y="127" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">用户</text><rect x="320" y="102" width="305" height="710" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/><text x="338" y="127" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">桌面端规则与状态</text><rect x="645" y="102" width="270" height="710" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/><text x="663" y="127" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">AI 网关</text><rect x="940" y="102" width="275" height="710" rx="8" fill="#F3F6FA" stroke="#D9E2EC"/><text x="958" y="127" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">模型</text><polyline points="280,177.5 350,177.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="472.5,210 472.5,250" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="472.5,315 472.5,355" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="595,387.5 660,387.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="895,387.5 960,387.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1075.0,420 1075.0,497.5 895,497.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,497.5 595,497.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="350,497.5 280,497.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="895,387.5 925,387.5 925,607.5 895,607.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,607.5 595,607.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="350,607.5 310,607.5 310,387.5 350,387.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><polyline points="280,752.5 350,752.5" fill="none" stroke="#52677c" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="145" width="230" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="62" y="184" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">输入自然语言行动</text><rect x="350" y="145" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="184" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">理解行动／校验规则</text><rect x="350" y="250" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="289" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">执行判定并提交状态</text><rect x="350" y="355" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="394" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">生成叙事请求／组装上下文</text><rect x="660" y="355" width="235" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="672" y="394" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">模型接入／调用与检索</text><rect x="960" y="355" width="230" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="972" y="394" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">生成叙事内容</text><rect x="660" y="465" width="235" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="672" y="504" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">返回内容／记录调用元数据</text><rect x="350" y="465" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="504" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">接收并展示生成结果</text><rect x="50" y="465" width="230" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="62" y="504" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">查看结果／继续行动</text><rect x="660" y="575" width="235" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="672" y="614" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">生成失败：返回错误</text><rect x="350" y="575" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="614" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">沿用已提交结果重试</text><rect x="50" y="720" width="230" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="62" y="759" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">选择历史检查点</text><rect x="350" y="720" width="245" height="65" rx="8" fill="#FFFFFF" stroke="#6A8DAD"/><text x="362" y="759" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">创建恢复副本／保留原历史</text><rect x="25" y="840" width="1190" height="185" rx="8" fill="#EDF4FA" stroke="#D9E2EC"/><text x="45" y="870" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">数据职责</text><text x="45" y="904" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">桌面 SQLite：settings.sqlite 保存设置；各 campaign.sqlite 保存战役事实和历史。</text><text x="45" y="939" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">网关：SQLAlchemy 默认 SQLite，可配置 PostgreSQL 17；保存会话与调用元数据。</text><text x="45" y="974" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">模型不直接改写权威状态。重试不重复判定；检查点恢复保留原历史。</text><text x="45" y="1007" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#243B53">SQLite／PostgreSQL 属于分层存储与后端切换，不是双写或主从复制。</text></svg>