### LLaMA-Factory LoRA：Qwen2.5-3B-Instruct，单卡 24GB 约 1-3 小时
### 定位：风格微调（GM 语气与叙述格式），不是能力微调

model_name_or_path: Qwen/Qwen2.5-3B-Instruct

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,v_proj

dataset: trpg_dm
dataset_dir: tools/lora/data
template: qwen
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 4

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
logging_steps: 10
save_steps: 100

fp16: true
output_dir: saves/qwen2.5-3b-lora-trpg
